<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookworm — Find Your Next Read</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.watsonAssistantChatOptions = {
        integrationID: "617a2e7e-f531-42ac-8b48-76ab81f19690",
        region: "au-syd",
        serviceInstanceID: "3cb167a6-8e7e-4bdc-bb81-587da974d366",
        openChatByDefault: false,
        onLoad: async (instance) => {
          await instance.render();
          window.watsonInstance = instance;
          console.log("✅ Watson ready!");
          instance.on({
            type: "receive",
            handler: (event) => {
              const responses = event.data?.output?.generic || [];
              responses.forEach((item) => {
                if (item.response_type === "text" && window.watsonResponseHandler) {
                  window.watsonResponseHandler(item.text);
                }
              });
            },
          });
        },
      };
      setTimeout(function () {
        const t = document.createElement("script");
        t.src = "https://web-chat.global.assistant.watson.appdomain.cloud/versions/" +
          (window.watsonAssistantChatOptions.clientVersion || "latest") +
          "/WatsonAssistantChatEntry.js";
        document.head.appendChild(t);
      });
    </script>
  </body>
</html>
